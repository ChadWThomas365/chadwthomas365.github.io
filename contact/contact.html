        <section class="contact-form">
          <h2>Send a Message to Chad W. Thomas</h2>

          <form action="mailto:chadwthomasbusiness@gmail.com" method="post" enctype="text/plain">

              <label for="name">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                required
              >
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                name="subject"
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="8"
                required
            ></textarea>

            <button type="submit">Send Message</button>

          </form>
